    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl}
    prompt-version: clasificacion-v1

logging:
  level:
    ar.edu.utn.frba.arbiter: INFO
