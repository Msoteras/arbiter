server:
  port: 8082

spring:
  application:
    name: siniestros-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

arbiter:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl}
    prompt-version: clasificacion-v1
    num-ctx: ${OLLAMA_NUM_CTX:8192}

logging:
  level:
    ar.edu.utn.frba.arbiter: INFO
