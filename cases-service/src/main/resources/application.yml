server:
  port: 8083

spring:
  application:
    name: cases-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  threads:
    virtual:
      enabled: true

arbiter:
  classification-service:
    url: ${CLASSIFICATION_SERVICE_URL:http://localhost:8082}
  # Resuelve el nombre del analista al asignar un expediente (no se lee la tabla users directo:
  # es de auth-service).
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
