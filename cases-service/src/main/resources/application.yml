server:
  # PORT is injected by the hosting platform; the literal is the local default.
  port: ${PORT:8083}

spring:
  application:
    name: cases-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Below Hikari's default of ten: several services share a small Postgres plan's connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Required with multi-tenancy: an open-in-view session resolves its tenant on the first query
    # and stays pinned to it for the rest of the request.
    open-in-view: false
    hibernate:
      # Never `update`: with the multi-tenant search_path, Hibernate would recreate the
      # arbiter_common tables inside each tenant schema. db/init-multitenant.sql owns the schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # With entities split between arbiter_common and the tenant schema, `grouped` only
          # inspects the default schema and reports the common tables as missing.
          jdbc_metadata_extraction_strategy: individually
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Spring's 1MB default is smaller than a typical phone photo; a claim carries several attachments.
      max-file-size: 10MB
      max-request-size: 30MB

arbiter:
  classification-service:
    url: ${CLASSIFICATION_SERVICE_URL:http://localhost:8082}
  rules-service:
    url: ${RULES_SERVICE_URL:http://localhost:8081}
  classification-refresh:
    # 20s x 540 = a 3h window: Ollama on CPU can take over an hour, and giving up early marks as
    # failed a classification that later succeeds. Same criterion as OllamaClient's timeout.
    interval-ms: 20000
    max-attempts: 540
    # Requeues CLASSIFICATION_FAILED cases whose reason was INFRASTRUCTURE. Much sparser than
    # interval-ms: retries already ran for minutes, so requeuing sooner would hammer a service still down.
    recovery-interval-ms: 300000
  document-recheck:
    # Rechecks claims filed while rules-service was down. Sparse for the same reason as recovery.
    interval-ms: ${DOCUMENT_RECHECK_INTERVAL_MS:300000}
  deadline-sweep:
    # Daily because the art. 56 term is day-granular. For local testing use every minute (0 * * * * *).
    cron: ${DEADLINE_SWEEP_CRON:0 0 8 * * *}
  policy-resync:
    # Daily realignment of the local policy copies with the insurer DB, at a low-load hour since it
    # walks every policy.
    cron: ${POLICY_RESYNC_CRON:0 0 3 * * *}
  messaging:
    # Days the case thread stays open after resolution. Platform setting, not an insurer rule.
    reply-window-days: ${REPLY_WINDOW_DAYS:7}
  email:
    # Without a key the adapter logs instead of sending; notifications are still recorded.
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-address: ${SENDGRID_FROM_ADDRESS:no-reply@arbiter.test}
    from-name: ${SENDGRID_FROM_NAME:Arbiter}
  auth:
    jwt:
      secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        # Health only: anything else would be reachable from the internet on a public domain.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
