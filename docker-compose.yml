services:

  # ─── Persistence ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-arbiter}
      POSTGRES_USER: ${DB_USER:-arbiter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arbiter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arbiter} -d ${DB_NAME:-arbiter}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ─── LLM ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Pulls the models into the volume on first run; no-op if already cached.
  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3-vl"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  # ─── Embeddings (CLIP sidecar) ──────────────────────────────────────────
  # Deterministic image embeddings for duplicate detection: the same image
  # always yields the same 512-dim vector. Ollama has no working image
  # embedding model, so this runs CLIP ViT-B-32 in a small Python service.
  clip-embedding:
    build:
      context: ./embedding-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Backend modules ────────────────────────────────────────────────────
  classification-service:
    build:
      context: .
      dockerfile: classification-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_SERVICE_URL: http://clip-embedding:8000
      # Opt-in: sends images to Google. Set both in your .env (never commit the key).
      GOOGLE_VISION_ENABLED: ${GOOGLE_VISION_ENABLED:-false}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-arbiter}
      DB_USER: ${DB_USER:-arbiter}
      DB_PASSWORD: ${DB_PASSWORD:-arbiter}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clip-embedding:
        condition: service_healthy
    restart: on-failure

  cases-service:
    build:
      context: .
      dockerfile: cases-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      CLASSIFICATION_SERVICE_URL: http://classification-service:8082
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-arbiter}
      DB_USER: ${DB_USER:-arbiter}
      DB_PASSWORD: ${DB_PASSWORD:-arbiter}
    depends_on:
      classification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

  # TODO: add the remaining services as they get implemented:
  # auth-service       → port 8080
  # rules-service      → port 8081
  # reports-service    → port 8084
  # arbiter-frontend   → port 5173

volumes:
  ollama_data:
  postgres_data:
