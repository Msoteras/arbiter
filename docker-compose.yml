services:

  # ─── Persistence ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-arbiter}
      POSTGRES_USER: ${DB_USER:-arbiter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arbiter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arbiter} -d ${DB_NAME:-arbiter}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ─── LLM ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Pulls the model into the volume on first run; no-op if it's already cached.
  ollama-init:
    image: ollama/ollama
    entrypoint: ["ollama", "pull", "qwen3-vl"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  # ─── Backend modules ────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-arbiter}
      DB_USER: ${DB_USER:-arbiter}
      DB_PASSWORD: ${DB_PASSWORD:-arbiter}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  classification-service:
    build:
      context: .
      dockerfile: classification-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-arbiter}
      DB_USER: ${DB_USER:-arbiter}
      DB_PASSWORD: ${DB_PASSWORD:-arbiter}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: on-failure

  cases-service:
    build:
      context: .
      dockerfile: cases-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      CLASSIFICATION_SERVICE_URL: http://classification-service:8082
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-arbiter}
      DB_USER: ${DB_USER:-arbiter}
      DB_PASSWORD: ${DB_PASSWORD:-arbiter}
    depends_on:
      classification-service:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

  # TODO: add the remaining services as they get implemented:
  # rules-service      → port 8081
  # reports-service    → port 8084
  # arbiter-frontend   → port 5173

volumes:
  ollama_data:
  postgres_data:
