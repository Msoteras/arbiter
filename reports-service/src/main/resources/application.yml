server:
  # PORT is injected by the platform (Railway); the literal is the local default.
  port: ${PORT:8084}

spring:
  application:
    name: reports-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Below Hikari's default of ten: several services share one Postgres, and the defaults
      # alone exhaust a small plan's connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Required with multi-tenancy: an open-in-view session resolves its tenant on the request's
    # first query and stays pinned to it for the rest of the request.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # Entities are split between arbiter_common and the tenant schema; `grouped` only
          # inspects the default schema and reports the common tables as missing.
          jdbc_metadata_extraction_strategy: individually
  threads:
    virtual:
      enabled: true

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
  # The hostname differs per environment, so it is exposed under an env var people can guess;
  # the relaxed-binding name of the @Value in RulesServiceClient (ARBITER_RULESSERVICE_URL) is not.
  rules-service:
    url: ${RULES_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        # Health only: anything else exposed here would be reachable from the internet on
        # whichever service gets a public domain.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
