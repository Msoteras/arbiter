server:
  # PORT is injected by the hosting platform; the literal is the local default.
  port: ${PORT:8081}

spring:
  application:
    name: rules-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Below Hikari's default of ten: several services share one Postgres and its connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # With multi-tenancy, an open-in-view session resolves its tenant on the first query and
    # stays pinned to it for the rest of the request.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # Entities span arbiter_common and the tenant schema; `grouped` only inspects the
          # default schema and reports the common tables as missing.
          jdbc_metadata_extraction_strategy: individually
  threads:
    virtual:
      enabled: true

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        # Health only: anything else exposed here would be reachable from the internet.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
