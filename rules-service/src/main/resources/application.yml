server:
  # ${PORT} is what the platform injects (Railway); the literal stays as the local
  # default so docker-compose and `mvn spring-boot:run` keep the ports the team knows.
  port: ${PORT:8081}

spring:
  application:
    name: rules-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Five and not Hikari's default ten: with the services deployed plus every developer's
      # local stack pointing at the same Postgres, the defaults alone exhaust a small plan's
      # connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Off, not just best-practice: with multi-tenancy, an open-in-view session opens (and
    # resolves its tenant) on the request's first query and stays pinned to it for the
    # rest of the request — see auth-service's application.yml for the concrete bug this
    # caused there.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # Ver el comentario de auth-service: con las entidades repartidas entre
          # arbiter_common y el esquema del tenant, `grouped` sólo mira el esquema por
          # defecto y da por faltantes las del común.
          jdbc_metadata_extraction_strategy: individually
  threads:
    virtual:
      enabled: true

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        # Health only: this is the platform probe, not an ops console. Anything else exposed
        # here would be reachable from the internet on whichever service gets a public domain.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
