<div class="app-shell">
  @if (showShell()) {
    <header class="topbar">
      <span class="logo">LOGO</span>
      <span class="topbar-title">Arbiter · Gestión de siniestros</span>
      @if (session.session(); as s) {
        <span class="who">
          {{ s.nombre }} {{ s.apellido }} · {{ roleLabel(s.rol) }}
          <button type="button" class="link-btn" (click)="logout()">Cerrar sesión</button>
        </span>
      }
    </header>
    <div class="app-body">
      <!-- Hasta que Auth0 aporte RBAC completo, las dos vistas conviven en la misma nav. -->
      <nav class="sidebar">
        <span class="nav-section">Analista</span>
        <a routerLink="/bandeja" routerLinkActive="active">Bandeja</a>
        <a class="disabled" title="Sin datos">Pendientes (Fast Track)</a>
        <span class="nav-section">Asegurado</span>
        <a routerLink="/portal" routerLinkActive="active">Mis expedientes</a>
        <a routerLink="/nueva-denuncia" routerLinkActive="active">Nueva denuncia</a>
      </nav>
      <main class="app-content">
        <router-outlet />
      </main>
    </div>
  } @else {
    <router-outlet />
  }
</div>
