<div class="login-page">
  <!-- Cordillera ditherizada a sangre en el borde inferior. Decorativa. -->
  <img class="mtn" src="/brand/mtn-teal-cutout.png" alt="" aria-hidden="true" />

  <div class="stack">
    <app-logo variant="lockup" class="brand-lockup" />

    <form class="card" (submit)="$event.preventDefault(); submit()">
      <div class="field">
        <label class="field-label" for="login-email">Correo</label>
        <app-input
          id="login-email"
          type="email"
          autocomplete="username"
          placeholder="analista@aseguradora.com"
          [value]="email()"
          (valueChange)="email.set($event)"
        />
      </div>

      <div class="field">
        <div class="field-label-row">
          <label class="field-label" for="login-password">Contraseña</label>
          <a class="field-link" routerLink="/forgot-password">Olvidé mi contraseña</a>
        </div>
        <app-input
          id="login-password"
          type="password"
          autocomplete="current-password"
          [revealable]="true"
          [value]="password()"
          (valueChange)="password.set($event)"
        />
      </div>

      @if (errorMessage()) {
        <p class="error" role="alert" aria-live="polite">{{ errorMessage() }}</p>
      }

      <app-button type="submit" [block]="true" [loading]="submitting()" [disabled]="!canSubmit()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </app-button>
    </form>

    <p class="support-note t-note">
      ¿No podés ingresar o necesitás una cuenta? Contactá a soporte.
    </p>
  </div>
</div>
