<div class="login-page">
  <img class="mtn" src="/brand/mtn-teal-cutout.png" alt="" aria-hidden="true" />
  <div class="mist" aria-hidden="true"></div>

  <div class="stack">
    <app-logo variant="lockup" class="brand-lockup" />

    <form class="card" (submit)="$event.preventDefault(); submit()">
      <app-field label="Correo" for="login-email">
        <app-input
          id="login-email"
          type="email"
          autocomplete="username"
          placeholder="analista@aseguradora.com"
          [value]="email()"
          (valueChange)="email.set($event)"
        />
      </app-field>

      <app-field label="Contraseña" for="login-password">
        <a fieldAside class="field-link" routerLink="/forgot-password">Olvidé mi contraseña</a>
        <app-input
          id="login-password"
          type="password"
          autocomplete="current-password"
          [revealable]="true"
          [value]="password()"
          (valueChange)="password.set($event)"
        />
      </app-field>

      @if (errorMessage()) {
        <p class="error" role="alert" aria-live="polite">{{ errorMessage() }}</p>
      }

      <app-button type="submit" [block]="true" [loading]="submitting()" [disabled]="!canSubmit()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </app-button>
    </form>

    <p class="support-note t-note">
      ¿No podés ingresar o necesitás una cuenta? Contactá a soporte.
    </p>
  </div>
</div>
