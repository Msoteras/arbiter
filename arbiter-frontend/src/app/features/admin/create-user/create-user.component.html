<p class="t-note">Le va a llegar un mail para elegir su contraseña.</p>

<form class="form-card" (submit)="$event.preventDefault(); submit()">
  <app-field label="Nombre" for="first-name">
    <app-input id="first-name" [value]="firstName()" (valueChange)="firstName.set($event)" />
  </app-field>

  <app-field label="Apellido" for="last-name">
    <app-input id="last-name" [value]="lastName()" (valueChange)="lastName.set($event)" />
  </app-field>

  <app-field label="Email" for="email">
    <app-input id="email" type="email" [value]="email()" (valueChange)="email.set($event)" />
  </app-field>

  <app-field label="Rol">
    <p class="t-body mono role-display">Analista de siniestros</p>
  </app-field>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <div class="form-actions">
    <app-button type="button" variant="secondary" (click)="cancel.emit()">Cancelar</app-button>
    <app-button type="submit" [disabled]="!canSubmit() || submitting()">
      {{ submitting() ? 'Creando…' : 'Crear usuario' }}
    </app-button>
  </div>
</form>
