@if (loading()) {
  <app-inline-loading [size]="26" message="Cargando atribuciones…" />
} @else {
  <header class="at-head" @fadeInUp>
    <h2 class="t-section-label">Atribuciones de liquidación</h2>
  </header>

  <app-card @fadeInUp>
    <div class="at-section-head">
      <span class="t-section-label">Tope por ramo</span>
      <app-info-tip>Sin tope, el analista autoriza cualquier monto.</app-info-tip>
    </div>

    <ul class="rows">
      @for (a of authorities(); track a.branchId) {
        <li class="row">
          <div class="row-text">
            <label class="row-name" [for]="'tope-' + a.branchId">{{ a.branchName }}</label>
          </div>
          <app-input
            [id]="'tope-' + a.branchId"
            prefix="$"
            align="end"
            inputmode="numeric"
            placeholder="Sin tope"
            [value]="draftLabel(a.branchId)"
            (valueChange)="setDraft(a.branchId, $event)"
          />
        </li>
      } @empty {
        <li class="row"><p class="t-note">No hay ramos configurados.</p></li>
      }
    </ul>

    <app-save-bar
      [dirty]="dirty()"
      [saving]="saving()"
      [error]="error()"
      (save)="save()"
      (discard)="discard()"
    />
  </app-card>
}
