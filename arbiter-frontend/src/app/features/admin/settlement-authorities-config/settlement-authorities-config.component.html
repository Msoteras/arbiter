@if (loading()) {
  <app-inline-loading [size]="26" message="Cargando atribuciones…" />
} @else {
  <app-card heading="Atribuciones de liquidación" headingSize="lg" @fadeInUp>
    <app-info-tip cardAside>Hasta cuánto puede autorizar un analista en cada ramo.</app-info-tip>

    <span class="t-section-label">Tope por ramo</span>

    <ul class="rows">
      @for (a of authorities(); track a.branchId) {
        <li class="row">
          <div class="row-text">
            <label class="row-name" [for]="'tope-' + a.branchId">{{ a.branchName }}</label>
            <p class="row-hint">Por encima de este monto, la liquidación pasa al referente</p>
          </div>
          <app-input
            [id]="'tope-' + a.branchId"
            prefix="$"
            align="end"
            inputmode="numeric"
            placeholder="Sin tope"
            [value]="draftLabel(a.branchId)"
            (valueChange)="setDraft(a.branchId, $event)"
          />
        </li>
      } @empty {
        <li class="row"><p class="t-note">No hay ramos configurados.</p></li>
      }
    </ul>

    <app-save-bar
      [dirty]="dirty()"
      [saving]="saving()"
      [error]="error()"
      (save)="save()"
      (discard)="discard()"
    />
  </app-card>
}
