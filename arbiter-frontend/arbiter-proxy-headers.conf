# Shared by every proxied location in nginx.conf.template.
#
# Lives outside /etc/nginx/conf.d/ on purpose: the stock nginx.conf does
# `include /etc/nginx/conf.d/*.conf` inside its http block, so a fragment dropped in there would
# be loaded a second time at http level, silently applying to everything. It is also NOT a
# .template, so envsubst never touches the nginx variables below.

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The platform terminates TLS in front of this container, so the scheme nginx sees is http.
# Spring only reads these to build absolute URLs (Swagger, redirects); without them those come
# back as http:// links that a browser on an https page refuses to follow.
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
