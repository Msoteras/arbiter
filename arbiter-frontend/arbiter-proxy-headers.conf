# Shared by every proxied location in nginx.conf.template.
# Outside conf.d/ because nginx.conf includes conf.d/*.conf at http level, which would apply it to
# everything; not a .template so envsubst leaves the variables below alone.

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# TLS terminates before this container; without these Spring builds absolute URLs (Swagger,
# redirects) as http://, which browsers on an https page refuse to follow.
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
