server:
  # PORT is injected by the hosting platform; the literal is the local default.
  port: ${PORT:8080}

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Below Hikari's default of 10 so all services together fit a small plan's connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Required with multi-tenancy: an open-in-view session pins the tenant of the request's first
    # query, but AuthService sets the real tenant afterwards.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # Entities span arbiter_common and the tenant schema. The default (`grouped`) reads
          # metadata from current_schema() only, so validation misses the common tables;
          # `individually` resolves each table through the search_path.
          jdbc_metadata_extraction_strategy: individually

arbiter:
  auth:
    provider: ${AUTH_PROVIDER:auth0}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    login:
      max-failed-attempts: 5
      lockout-minutes: 15
    password-encryption:
      # RSA private key (PKCS#8, base64). Empty generates one at startup: fine for dev, but with
      # several instances each would have its own and logins would fail intermittently.
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0
      private-key: ${PASSWORD_ENCRYPTION_PRIVATE_KEY:}
    auth0:
      domain: ${AUTH0_DOMAIN:}
      client-id: ${AUTH0_LOGIN_CLIENT_ID:}
      client-secret: ${AUTH0_LOGIN_CLIENT_SECRET:}
      connection: Username-Password-Authentication
    management-api:
      client-id: ${AUTH0_MGMT_CLIENT_ID:}
      client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
  email:
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-address: ${SENDGRID_FROM_ADDRESS:no-reply@arbiter.test}
    from-name: ${SENDGRID_FROM_NAME:Arbiter}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  # Bulk insured provisioning paces invitation mails to protect sender reputation and stay under
  # SendGrid's rate limits; the cap bounds how many invitations a single run sends.
  provisioning:
    invite-delay-ms: ${PROVISIONING_INVITE_DELAY_MS:250}
    max-invites-per-run: ${PROVISIONING_MAX_INVITES_PER_RUN:500}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # Health only: anything else would be reachable from the internet on a public service.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
