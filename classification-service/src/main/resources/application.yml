server:
  port: 8082

spring:
  application:
    name: classification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
  jpa:
    # Off, not just best-practice: with multi-tenancy, an open-in-view session opens (and
    # resolves its tenant) on the request's first query and stays pinned to it for the rest
    # of the request — see auth-service's application.yml for the concrete bug this caused
    # there.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          # Ver el comentario de auth-service: con las entidades repartidas entre
          # arbiter_common y el esquema del tenant, `grouped` sólo mira el esquema por
          # defecto y da por faltantes las del común.
          jdbc_metadata_extraction_strategy: individually

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl}
    prompt-version: classification-v1
    num-ctx: ${OLLAMA_NUM_CTX:32768}
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}
    model: ${EMBEDDING_MODEL:clip-vit-b-32-openai}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.90}
    max-results: ${EMBEDDING_MAX_RESULTS:5}
  # Sends claim images to a third party — opt-in only, requires the insured's consent.
  google-vision:
    enabled: ${GOOGLE_VISION_ENABLED:false}
    api-key: ${GOOGLE_VISION_API_KEY:}
    max-results: ${GOOGLE_VISION_MAX_RESULTS:10}

logging:
  level:
    ar.edu.utn.frba.arbiter: ${LOG_LEVEL:INFO}
