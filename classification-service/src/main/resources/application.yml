server:
  # PORT is injected by the platform; the literal is the local default.
  port: ${PORT:8082}

spring:
  application:
    name: classification-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # cases-service sends ALL of a case's documents on every (re)classification. The per-file
      # cap matches cases-service's upload limit; the request cap covers several files per call.
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
    hikari:
      # Below Hikari's default of 10 so all services together fit a small plan's connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Required with multi-tenancy: an open-in-view session would stay pinned to the tenant
    # resolved on the request's first query.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          # Entities span arbiter_common and the tenant schema; `grouped` only inspects the
          # default schema and reports the common tables as missing.
          jdbc_metadata_extraction_strategy: individually

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
  rules-service:
    url: ${RULES_SERVICE_URL:http://localhost:8081}
  classification:
    retry:
      # Retry window when a dependency is down (~4-5 min total), long enough to outlast a
      # container restart or a deploy.
      max-attempts: ${CLASSIFICATION_RETRY_MAX_ATTEMPTS:6}
      initial-delay-ms: ${CLASSIFICATION_RETRY_INITIAL_DELAY_MS:15000}
      multiplier: ${CLASSIFICATION_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${CLASSIFICATION_RETRY_MAX_DELAY_MS:60000}
  llm:
    # `ollama` (default) or `gemini`. Keep the default: nobody should start calling a paid API
    # just by pulling a branch.
    provider: ${LLM_PROVIDER:ollama}
    # Loads prompts/<version>.md and is persisted in llm_analysis.prompt_version. Bumping it
    # without creating the file fails at startup, on purpose.
    prompt-version: classification-v6
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl:8b-instruct}
    num-ctx: ${OLLAMA_NUM_CTX:32768}
  gemini:
    # No API key: the SDK authenticates through ADC.
    project: ${GOOGLE_CLOUD_PROJECT:}
    # Gemini 3 is only served from `global` and the `us`/`eu` multi-regions. `global` gives no
    # control over data residency: switch to `us` or `eu` before handling real data.
    location: ${GOOGLE_CLOUD_LOCATION:global}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    # Same role as Ollama's num-predict: a runaway generation is billed.
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
    # Only used to warn before overflowing; the real window is the model's.
    context-window: ${GEMINI_CONTEXT_WINDOW:1000000}
  embedding:
    service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}
    model: ${EMBEDDING_MODEL:clip-vit-b-32-openai}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.90}
    max-results: ${EMBEDDING_MAX_RESULTS:5}
  # Sends claim images to a third party — opt-in only, requires the insured's consent.
  google-vision:
    enabled: ${GOOGLE_VISION_ENABLED:false}
    api-key: ${GOOGLE_VISION_API_KEY:}
    max-results: ${GOOGLE_VISION_MAX_RESULTS:10}

logging:
  level:
    ar.edu.utn.frba.arbiter: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        # Health only: anything else would be reachable from the internet on a public service.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
