server:
  port: 8082

spring:
  application:
    name: classification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arbiter}
    username: ${DB_USER:arbiter}
    password: ${DB_PASSWORD:arbiter}
  jpa:
    # Off, not just best-practice: with multi-tenancy, an open-in-view session opens (and
    # resolves its tenant) on the request's first query and stays pinned to it for the rest
    # of the request — see auth-service's application.yml for the concrete bug this caused
    # there.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          # Ver el comentario de auth-service: con las entidades repartidas entre
          # arbiter_common y el esquema del tenant, `grouped` sólo mira el esquema por
          # defecto y da por faltantes las del común.
          jdbc_metadata_extraction_strategy: individually

arbiter:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
  rules-service:
    url: ${RULES_SERVICE_URL:http://localhost:8081}
  llm:
    # Quién sirve el modelo: `ollama` (default) o `gemini`. El default NO es un detalle: es el
    # despliegue que describe el documento de arquitectura, y nadie tiene que empezar a pegarle a
    # una API paga por bajarse una rama.
    provider: ${LLM_PROVIDER:ollama}
    # Fuente única: PromptBuilder carga prompts/<esta versión>.md y esto es lo que se persiste en
    # llm_analysis.prompt_version (auditoría SSN 2/2023). Bumpearla sin crear el archivo rompe al
    # arrancar, a propósito.
    prompt-version: classification-v4
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl:8b-instruct}
    num-ctx: ${OLLAMA_NUM_CTX:32768}
  gemini:
    # Sin API key: el SDK autentica por ADC (`gcloud auth application-default login` en la máquina,
    # service account en Docker), así que no hay secreto que pueda terminar versionado acá.
    project: ${GOOGLE_CLOUD_PROJECT:}
    # `global` y no una región concreta: los Gemini 3 solo se sirven desde el endpoint global y
    # desde las multirregión `us`/`eu`. La contra es que con `global` no se controla dónde ocurre
    # el procesamiento, así que el día que haya datos reales esto pasa a `us` o `eu` (o a una
    # región, con el modelo que esa región tenga) y ahí sí se puede afirmar residencia de datos.
    location: ${GOOGLE_CLOUD_LOCATION:global}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    # Equivalente a num-predict de Ollama: al modelo se le pide un JSON chico, y una generación
    # desbocada acá se factura.
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
    # Solo para avisar antes de desbordar; la ventana real la fija el modelo, no nosotros.
    context-window: ${GEMINI_CONTEXT_WINDOW:1000000}
  embedding:
    service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}
    model: ${EMBEDDING_MODEL:clip-vit-b-32-openai}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.90}
    max-results: ${EMBEDDING_MAX_RESULTS:5}
  # Sends claim images to a third party — opt-in only, requires the insured's consent.
  google-vision:
    enabled: ${GOOGLE_VISION_ENABLED:false}
    api-key: ${GOOGLE_VISION_API_KEY:}
    max-results: ${GOOGLE_VISION_MAX_RESULTS:10}

logging:
  level:
    ar.edu.utn.frba.arbiter: ${LOG_LEVEL:INFO}
