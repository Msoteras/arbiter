<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Arbiter — Login 7g (referencia de diseño)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #23252b; display: flex; justify-content: center; padding: 40px; }
  .screen {
    width: 1440px; height: 1024px; background: #f4efe4; color: #1b1a17;
    font-family: Archivo, Helvetica, Arial, sans-serif;
    position: relative; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .mtn { position: absolute; left: 0; bottom: 0; width: 1440px; display: block; }
  .stack {
    position: absolute; left: 50%; top: 150px; transform: translateX(-50%);
    width: 384px; display: flex; flex-direction: column; align-items: center; gap: 32px;
  }
  .lockup { width: 190px; display: block; }
  .card {
    width: 100%; background: #fffdf8; border: 1px solid #e3dcca; border-radius: 10px;
    padding: 28px; box-shadow: 0 1px 2px rgba(27,26,23,0.06);
    display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; }
  .label { font-size: 13px; font-weight: 500; color: #1b1a17; }
  input {
    height: 40px; border: 1px solid #ded7c6; border-radius: 6px; background: #fffdf8;
    padding: 0 12px; font-family: inherit; font-size: 14px; color: #1b1a17; outline: none;
    box-sizing: border-box;
  }
  input:focus { border-color: #1e3f8f; box-shadow: 0 0 0 3px rgba(30,63,143,0.12); }
  input::placeholder { color: #a49d8e; }
  button {
    margin-top: 4px; height: 40px; background: #1b1a17; color: #f8f6f0; border: none;
    border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #1e3f8f; }
  a { font-size: 13px; color: #6f6a5e; text-decoration: none; }
  a:hover { color: #1e3f8f; text-decoration: underline; }
</style>
</head>
<body>
  <div class="screen">
    <img class="mtn" src="assets/mtn-teal-cutout.png" alt="Cordillera ditherizada">
    <div class="stack">
      <img class="lockup" src="assets/arbiter-lockup.svg" alt="Arbiter">
      <form class="card" onsubmit="return false">
        <label class="field">
          <span class="label">Correo</span>
          <input type="email" placeholder="analista@aseguradora.com">
        </label>
        <label class="field">
          <span class="field-head">
            <span class="label">Contraseña</span>
            <a href="#">Olvidé mi contraseña</a>
          </span>
          <input type="password" placeholder="••••••••">
        </label>
        <button type="submit">Entrar</button>
      </form>
      <a href="#">Solicitar acceso</a>
    </div>
  </div>
</body>
</html>
