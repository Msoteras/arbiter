# =============================================================================
# Overlay that runs classification-service on Gemini (Vertex) instead of local Ollama:
#
#   docker compose -f docker-compose.railway.yml -f docker-compose.gemini.yml up
#
# or through the wrapper that resolves the credential:
#
#   .\scripts\dev-gemini.ps1
#
# GOOGLE_ADC_HOST_PATH is the local path of the file left by
# `gcloud auth application-default login`, mounted read-only.
# =============================================================================
services:
  classification-service:
    environment:
      LLM_PROVIDER: gemini
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-project-fb32e998-d84b-4d72-911}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes:
      - ${GOOGLE_ADC_HOST_PATH:?falta GOOGLE_ADC_HOST_PATH — usá scripts\dev-gemini.ps1, que la resuelve sola}:/secrets/adc.json:ro
