services:

  # ─── LLM ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Descarga el modelo al volume antes de correr los tests.
  # Si el modelo ya está en el volume, termina en segundos.
  ollama-init:
    image: ollama/ollama
    entrypoint: ["ollama", "pull", "qwen3-vl"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # ─── Test runner ─────────────────────────────────────────────────────────
  siniestros-test:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app                        # fuente del proyecto
      - maven_cache:/root/.m2         # cache de dependencias Maven entre runs
    command: >
      mvn -pl common-lib,siniestros-service -am test
      -Dgroups=integracion
      -Dsurefire.failIfNoSpecifiedTests=false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3-vl
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_data:
  maven_cache:
