# =============================================================================
# Arbiter — los 5 módulos backend en Docker, apuntando a la BD de Railway.
#
# Distinto de docker-compose.yml (que trae su propio `postgres` local, base
# vacía): este archivo NO define un servicio de base de datos, así que no hay
# riesgo de arrancar el local por accidente ni de mezclar los dos.
#
# Lee la conexión de `.env` en la raíz del repo (Docker Compose lo carga solo,
# mismo archivo que usa scripts/run-local.ps1 y scripts/db-railway.ps1) — no
# hace falta pasar nada por -e ni duplicar credenciales acá.
#
# Uso:
#   docker compose -f docker-compose.railway.yml up --build
#
# Prerequisito: la base de Railway ya tiene que tener el esquema y el seed
# cargados (scripts/db-railway.ps1 all). Con ddl-auto=validate, si falta algo
# el contenedor no arranca — mirá sus logs, Hibernate dice tabla/columna/tipo.
#
# Ollama y el sidecar de embeddings NO van a Railway: corren acá al lado,
# igual que en el compose local.
#
# `name:` explícito porque sin uno, Compose usa el nombre de la carpeta
# ("arbiter") como nombre de proyecto — el mismo que docker-compose.yml, así
# que los dos quedarían tratados como el mismo stack y sus contenedores
# chocarían por nombre (pasó: "Conflict... arbiter-clip-embedding-1").
# =============================================================================

name: arbiter-railway

services:

  # ─── LLM ─────────────────────────────────────────────────────────────────
  # Los mem_limit de todo este archivo existen por un OOM real (18/08): el kernel mató el
  # proceso de llama-server en medio de una clasificación ("signal: killed"). Sin límites,
  # cada JVM se dimensiona sola contra la memoria TOTAL que ve (default del JVM: heap máximo
  # = 25% de la RAM disponible), así que 5 servicios Java podían comprometer bastante más
  # memoria de la que hay y dejar sin aire justo al que más necesita. Ahora cada uno tiene
  # su techo y la suma entra con margen en lo que Docker tiene asignado.
  ollama:
    image: ollama/ollama:latest
    # El más grande a propósito: acá viven los pesos del modelo (~6 GB con qwen3-vl Q4_K_M)
    # más el KV cache, que se reserva según num_ctx (32k) y no según lo que se use. Con 12g se
    # midió 11,86 GB en uso (98,9%) durante una clasificación real, así que ese techo estaba
    # justo en el borde de repetir el OOM que ya matamos una vez.
    mem_limit: 14g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3-vl:8b-instruct"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  # ─── Embeddings (CLIP sidecar) ──────────────────────────────────────────
  clip-embedding:
    build:
      context: ./embedding-service
    mem_limit: 2g
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Backend modules ────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      # Con mem_limit puesto el JVM (container-aware desde Java 10) toma como techo el 25% del
      # límite por default, que acá serían 256 MB y se queda corto. 75% usa bien lo asignado
      # dejando espacio para metaspace/threads/off-heap, que no entran en el heap.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      # DB_URL ya viene en formato JDBC con ?sslmode=require en el .env — se
      # pasa tal cual, sin reconstruirla como hace el compose local con `postgres`.
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      # Sin esto, InsuredDirectoryDatabaseAdapter (alta masiva de asegurados) nunca se activa y
      # cae en el mock silencioso — mismo patrón que classification-service/cases-service abajo.
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILES:-insurer-db}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-auth0}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_LOGIN_CLIENT_ID: ${AUTH0_LOGIN_CLIENT_ID:-}
      AUTH0_LOGIN_CLIENT_SECRET: ${AUTH0_LOGIN_CLIENT_SECRET:-}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@arbiter.test}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Arbiter}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
    restart: on-failure

  classification-service:
    build:
      context: .
      dockerfile: classification-service/Dockerfile
    # Un poco más que el resto: rasteriza PDFs a imagen en memoria antes de mandarlos al modelo.
    mem_limit: 1536m
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      SPRING_PROFILES_ACTIVE: ${CLASSIFICATION_PROFILES:-insurer-db}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      EMBEDDING_SERVICE_URL: http://clip-embedding:8000
      GOOGLE_VISION_ENABLED: ${GOOGLE_VISION_ENABLED:-false}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # Faltaba acá (17/08): sin esto cae al default de application.yml (localhost:8081), que
      # adentro del contenedor nunca resuelve a rules-service — RulesRestAdapter.getRules()
      # rompe con "Connection refused" en cada clasificación. docker-compose.yml (el local) sí
      # la tenía; se desalinearon los dos archivos.
      RULES_SERVICE_URL: http://rules-service:8081
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      clip-embedding:
        condition: service_healthy
    restart: on-failure

  cases-service:
    build:
      context: .
      dockerfile: cases-service/Dockerfile
    # Un poco más que el resto: recibe los adjuntos por multipart (hasta 10 MB por archivo).
    mem_limit: 1g
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      CLASSIFICATION_SERVICE_URL: http://classification-service:8082
      RULES_SERVICE_URL: http://rules-service:8081
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      SPRING_PROFILES_ACTIVE: ${CASES_PROFILES:-insurer-db}
      # Avisos de cambio de estado al asegurado. Sin la key el módulo levanta igual: la
      # notificación queda registrada en base y solo no sale el mail.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@arbiter.test}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Arbiter}
    depends_on:
      classification-service:
        condition: service_started
      rules-service:
        condition: service_started
    restart: on-failure

  rules-service:
    build:
      context: .
      dockerfile: rules-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      # Sin esto, JwtAuthenticationFilter (compartido por los 5 módulos) recibe una
      # clave vacía y Tomcat no arranca: WeakKeyException, 0 bits.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
    restart: on-failure

  reports-service:
    build:
      context: .
      dockerfile: reports-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
    restart: on-failure

volumes:
  ollama_data:
