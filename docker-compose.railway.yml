# =============================================================================
# Arbiter — the 5 backend modules and the frontend in Docker, against the Railway DB.
#
# Unlike docker-compose.yml it defines no database service. The connection comes from
# the root `.env`, which Compose loads on its own.
#
# Usage:
#   docker compose -f docker-compose.railway.yml up --build
#
# The Railway DB must already have schema and seed (scripts/db-railway.ps1 all): with
# ddl-auto=validate a container won't start if anything is missing.
#
# Local tweaks for this stack go in a local, gitignored docker-compose.railway.override.yml.
#
# Explicit `name:` because otherwise Compose uses the folder name, the same project as
# docker-compose.yml, and the containers would clash by name.
# =============================================================================

name: arbiter-railway

services:

  # ─── LLM ─────────────────────────────────────────────────────────────────
  # Every service has a mem_limit: unbounded, each JVM sizes its heap against the host's
  # total RAM and together they can starve the model server into an OOM kill.
  # Behind the `ollama` profile, as in docker-compose.yml. Keep both files in sync.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    # Model weights (~6 GB) plus a KV cache sized by num_ctx (32k), not by actual use.
    # 12g measured 98.9% in use during a real classification.
    mem_limit: 14g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3-vl:8b-instruct"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  # ─── Embeddings (CLIP sidecar) ──────────────────────────────────────────
  clip-embedding:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
    mem_limit: 2g
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Backend modules ────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      # The JVM defaults to 25% of the container limit; 75% still leaves room for off-heap.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      # Already a JDBC URL with ?sslmode=require in .env.
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      # Without it, bulk insured provisioning silently falls back to the mock adapter.
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILES:-insurer-db}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-auth0}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_LOGIN_CLIENT_ID: ${AUTH0_LOGIN_CLIENT_ID:-}
      AUTH0_LOGIN_CLIENT_SECRET: ${AUTH0_LOGIN_CLIENT_SECRET:-}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@arbiter.test}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Arbiter}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
    restart: on-failure

  classification-service:
    build:
      context: .
      dockerfile: classification-service/Dockerfile
    # A bit more than the rest: it rasterizes PDFs in memory before sending them to the model.
    mem_limit: 1536m
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      SPRING_PROFILES_ACTIVE: ${CLASSIFICATION_PROFILES:-insurer-db}
      # Must be declared here or LLM_PROVIDER from .env never reaches the container.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      # Gemini on Vertex: mount the credential with docker-compose.gemini.yml or a local,
      # gitignored docker-compose.railway.override.yml. No secrets here.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      EMBEDDING_SERVICE_URL: http://clip-embedding:8000
      GOOGLE_VISION_ENABLED: ${GOOGLE_VISION_ENABLED:-false}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # The yml default is localhost, which inside a container is the container itself.
      RULES_SERVICE_URL: http://rules-service:8081
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        # Without the `ollama` profile this service doesn't exist; required: false lets
        # classification-service start anyway.
        required: false
      clip-embedding:
        condition: service_healthy
    restart: on-failure

  cases-service:
    build:
      context: .
      dockerfile: cases-service/Dockerfile
    # A bit more than the rest: it receives multipart attachments of up to 10 MB each.
    mem_limit: 1g
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      CLASSIFICATION_SERVICE_URL: http://classification-service:8082
      RULES_SERVICE_URL: http://rules-service:8081
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      SPRING_PROFILES_ACTIVE: ${CASES_PROFILES:-insurer-db}
      # Without a key the notification is still stored; only the email is skipped.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@arbiter.test}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Arbiter}
    depends_on:
      classification-service:
        condition: service_started
      rules-service:
        condition: service_started
    restart: on-failure

  rules-service:
    build:
      context: .
      dockerfile: rules-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      # Required at startup by the JWT filter, as in every module.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
    restart: on-failure

  reports-service:
    build:
      context: .
      dockerfile: reports-service/Dockerfile
    mem_limit: 768m
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      DB_URL: ${DB_URL:?falta DB_URL en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # The dashboard's resolution target is this module's only read that is not SQL. The yml
      # default is localhost, which inside a container is the container itself.
      RULES_SERVICE_URL: http://rules-service:8081
    restart: on-failure

  # ─── Frontend ───────────────────────────────────────────────────────────
  # The built SPA served by nginx, which also reverse-proxies the 5 modules like
  # proxy.conf.json does for `ng serve`. The image defaults point at *.railway.internal,
  # so the five URLs are overridden with this network's service names.
  arbiter-frontend:
    build:
      context: .
      dockerfile: arbiter-frontend/Dockerfile
    mem_limit: 256m
    # Must match FRONTEND_BASE_URL in .env, the base of the invitation links.
    # Don't run `ng serve` alongside: on Windows localhost resolves to ::1 first, so
    # localhost:4200 silently serves the dev server. FRONTEND_PORT moves this one.
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      CASES_SERVICE_URL: http://cases-service:8083
      CLASSIFICATION_SERVICE_URL: http://classification-service:8082
      RULES_SERVICE_URL: http://rules-service:8081
      REPORTS_SERVICE_URL: http://reports-service:8084
    # No health condition: nginx resolves upstreams per request, so a backend that is down
    # only returns 502 on its own routes.
    depends_on:
      - auth-service
      - cases-service
      - classification-service
      - rules-service
      - reports-service
    restart: on-failure

volumes:
  ollama_data:
