# =============================================================================
# Fragmento simétrico a docker-compose.gemini.yml: fija Ollama como proveedor.
#
#   .\scripts\dev-ollama.ps1
#
# Existe para que el script gane sobre el docker-compose.override.yml de cada uno.
# Un override que fije `LLM_PROVIDER: gemini` como valor literal no lo pisa ninguna
# variable de entorno, así que sin este archivo `dev-ollama.ps1` seguiría clasificando
# por Gemini en silencio. Pasado último en la cadena de -f, decide.
# =============================================================================
services:
  classification-service:
    environment:
      LLM_PROVIDER: ollama
