# =============================================================================
# Counterpart of docker-compose.gemini.yml: pins Ollama as the provider.
#
#   .\scripts\dev-ollama.ps1
#
# Passed last in the -f chain, it beats any override that hardcodes `LLM_PROVIDER: gemini`,
# which no environment variable can override.
# =============================================================================
services:
  classification-service:
    environment:
      LLM_PROVIDER: ollama
