name: Guard main

# `main` es lo que se despliega, y el flujo acordado es que todo pase por `develop` primero: ahí
# se integra, ahí corre el CI contra el resto del trabajo del equipo. Un PR de una rama de feature
# directo a `main` se saltea esa integración y despliega código que nunca convivió con lo demás.
#
# La excepción son las `hotfix/*`: un arreglo urgente en producción no puede quedar esperando a que
# todo lo que haya en develop esté listo para salir. La contracara es que un hotfix mergeado acá
# NO vuelve solo a develop — hay que mergearlo de nuevo ahí, o el próximo despliegue lo pisa.
#
# Esto no impide ABRIR el PR — lo que hace es dejar el check en rojo. Para que además impida
# mergear, el job tiene que estar en los required status checks del ruleset de `main`; hoy no lo
# está (ver docs/despliegue-railway.md), así que funciona como señal, no como barrera.
on:
  pull_request:
    branches: [main]

jobs:
  only-from-develop:
    name: PR a main solo desde develop
    runs-on: ubuntu-latest
    steps:
      - name: Verificar la rama de origen
        # La rama viaja por env y no interpolada dentro del script: un nombre de rama es texto que
        # elige quien abre el PR, y metido directo en el shell se convierte en ejecución de código.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop)
              echo "Origen: develop — OK."
              exit 0
              ;;
            hotfix/*)
              echo "Origen: $HEAD_REF — OK, es un hotfix."
              echo "::warning::Acordate de mergear '$HEAD_REF' también a develop: un hotfix que" \
                   "solo entra a main lo pisa el próximo despliegue."
              exit 0
              ;;
          esac
          echo "::error::Este PR viene de '$HEAD_REF'. main solo acepta PRs desde 'develop' o desde una rama 'hotfix/*'."
          echo ""
          echo "Mergeá tu rama a develop primero y después abrí el PR develop -> main."
          exit 1
