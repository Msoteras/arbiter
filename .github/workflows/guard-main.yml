name: Guard main

# Everything reaches main through develop. This only fails the check, so it has to be a required
# status check on main to block the merge (docs/despliegue-railway.md).
on:
  pull_request:
    branches: [main]

jobs:
  only-from-develop:
    name: PR a main solo desde develop
    runs-on: ubuntu-latest
    steps:
      - name: Verificar la rama de origen
        # Through env, not interpolated: the branch name is text chosen by whoever opens the PR.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ]; then
            echo "Origen: $HEAD_REF — OK."
            exit 0
          fi
          echo "::error::Este PR viene de '$HEAD_REF' y main solo acepta PRs desde 'develop'."
          echo ""
          echo "Mergeá tu rama a develop primero y después abrí el PR develop -> main."
          exit 1
