name: CI

# Quality gate, not a deploy: Railway deploys on merge to main and waits for this run to pass
# (docs/despliegue-railway.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The whole reactor: a partial build picks up a stale common-lib jar ("cannot find symbol").
      - name: Build + tests
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arbiter-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Build de producción
        run: npm run build -- --configuration production

  # proxy.conf.json (ng serve) and nginx.conf.template (deploy) must declare the same routes:
  # a route missing from the latter only fails in production.
  routing-parity:
    name: Ruteo dev == ruteo prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comparar proxy.conf.json contra nginx.conf.template
        run: python3 scripts/check-routing-parity.py
